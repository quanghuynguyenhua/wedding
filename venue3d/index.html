<style>
/* Prototype only — not deployed. UI fonts/colours from site/index.html; the 3D look follows the "Tiny Diorama" style card. */
:root{
  --bg:#fcfcfb;--ink:#161514;--mute:#77736d;--line:#e6e3de;--soft:#f2f0ec;--hy:#b3261e;
  --acc:#e9573f;--blue:#2f6f9a;--must:#d99a1c;--sky:#b4d2de;
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;
  --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --gut:max(16px,env(safe-area-inset-left,0px));
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sky);color:var(--ink);font:400 15px/1.5 var(--sans);-webkit-text-size-adjust:100%}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button,input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.glass{background:rgba(252,252,251,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);box-shadow:0 6px 24px rgba(40,60,70,.12)}
/* tilt-shift: soft bands at the top and bottom of the picture, like a miniature photographed up close */
.ts{position:fixed;left:0;right:0;height:24%;z-index:2;pointer-events:none;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.ts.t{top:0;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
.ts.b{bottom:0;-webkit-mask-image:linear-gradient(transparent,#000);mask-image:linear-gradient(transparent,#000)}

.hd{position:fixed;top:14px;left:var(--gut);padding:12px 16px 11px;border-radius:14px;max-width:calc(100% - 150px);z-index:5}
.hd h1{font:400 22px/1.15 var(--serif);margin:0;letter-spacing:.01em}
.hd p{margin:2px 0 0;font-size:12.5px;color:var(--mute)}
.proto{display:inline-block;margin-top:6px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--hy);border:1px solid rgba(179,38,30,.35);border-radius:99px;padding:1px 8px}
.langs{position:fixed;top:14px;right:16px;border-radius:99px;padding:8px 0;min-width:52px;text-align:center;z-index:5;font-size:12.5px;font-weight:500;letter-spacing:.1em;cursor:pointer}
.langs:hover{border-color:#cfc8bd}
.langs button{border:0;background:none;padding:5px 10px;border-radius:99px;font-size:12px;letter-spacing:.08em;cursor:pointer;color:var(--mute)}
.langs button[aria-pressed=true]{background:var(--ink);color:#fff}

.modes{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;border-radius:99px;padding:4px;z-index:6}
.modes button{border:0;background:none;padding:9px 18px;border-radius:99px;font-size:13.5px;cursor:pointer;color:var(--mute);white-space:nowrap}
.modes button[aria-pressed=true]{background:var(--acc);color:#fff}

.ctl{position:fixed;right:16px;bottom:22px;display:flex;flex-direction:column;gap:8px;z-index:5;align-items:flex-end}
.ctl button,.ctl a{display:flex;align-items:center;gap:8px;border-radius:99px;padding:8px 14px 8px 11px;font-size:13px;cursor:pointer;white-space:nowrap}
.ctl button:hover,.ctl a:hover{border-color:#cfc8bd}
.ctl svg{width:18px;height:18px;flex:none}
.ctl .ln{width:18px;height:5px;border-radius:3px;flex:none}
.ctl .r1 .ln{background:var(--acc)}.ctl .r2 .ln{background:var(--blue)}.ctl .r3 .ln{background:var(--must)}
body[data-mode=city] .v-only,body[data-mode=venue] .c-only{display:none!important}

.card{position:fixed;left:var(--gut);bottom:22px;width:320px;border-radius:16px;padding:14px 40px 13px 16px;z-index:6;transform:translateY(12px);opacity:0;pointer-events:none;transition:.35s ease}
.card.on{transform:none;opacity:1;pointer-events:auto}
.card .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);display:flex;align-items:center;gap:8px}
.card .k i{display:inline-block;width:22px;height:5px;border-radius:3px;background:var(--acc)}
.card.r2 .k i{background:var(--blue)}.card.r3 .k i{background:var(--must)}
.card p{margin:6px 0 0;font-size:13.5px;line-height:1.5}
.card .x,.ask .x{position:absolute;top:8px;right:8px;border:0;background:none;width:32px;height:32px;border-radius:50%;cursor:pointer;color:var(--mute);font-size:20px;line-height:1}
.card .x:hover,.ask .x:hover{background:var(--soft)}
/* "how are you coming?" — shown once after the hotel fly-over */
.ask{position:fixed;left:50%;top:50%;width:min(370px,calc(100% - 32px));transform:translate(-50%,-46%);border-radius:20px;padding:24px 20px 20px;z-index:8;text-align:center;opacity:0;visibility:hidden;transition:opacity .35s ease,transform .35s ease,visibility 0s .35s}
.ask.on{opacity:1;visibility:visible;transform:translate(-50%,-50%);transition:opacity .35s ease,transform .35s ease}
.ask .x{border:0;background:none;width:32px;height:32px;border-radius:50%;cursor:pointer;color:var(--mute);font-size:20px;line-height:1;top:8px;right:8px}
.ask h2{font:400 20px/1.25 var(--serif);margin:0 14px 16px}
.ask .opts{display:flex;gap:10px}
.ask .opts button{flex:1;border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px 8px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:14px;font-weight:500;transition:border-color .2s,transform .2s}
.ask .opts button:hover,.ask .opts button:focus-visible{border-color:var(--ink);transform:translateY(-2px)}
.ask .opts svg{width:36px;height:36px}
.ask .opts .r2 svg{color:var(--blue)}.ask .opts .r3 svg{color:var(--must)}
body.night #bNight .i-sun,body:not(.night) #bNight .i-moon{display:none}

/* labels = little card signs on pins */
#labels{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;will-change:transform}
.lbl span{background:#f6ebd8;border-radius:7px;padding:3px 10px 4px;font:600 12.5px/1.3 "Fredoka",var(--sans);color:#272b36;white-space:nowrap;box-shadow:0 2px 0 rgba(39,43,54,.25),0 4px 10px rgba(39,43,54,.18)}
.lbl::after{display:none}
.lbl.water span{background:#e6f5f9;color:#2c6a80}
.lbl.hi span{background:var(--acc);color:#fff}
.lbl.p span{background:var(--blue);color:#fff}
.lbl.m span{background:var(--must);color:#fff}
body.night{--sky:#141b33}
body.night .load,body.night .hint{color:#c9d3ea}
.bk{display:inline-block;margin:0 8px 0 -4px;padding:0 6px;border-radius:8px;font:400 20px/1 var(--sans);color:var(--mute);vertical-align:2px}
.bk:hover{background:var(--soft)}
.lbl.road span{background:#6e7080;color:#fff;letter-spacing:.06em;font-size:11px}

.hint{position:fixed;left:50%;top:84px;transform:translateX(-50%);font-size:12.5px;color:var(--mute);padding:6px 14px;border-radius:99px;z-index:4;transition:opacity .6s;white-space:nowrap}
.hint.off{opacity:0}
.fade{position:fixed;inset:0;background:var(--sky);z-index:4;opacity:0;pointer-events:none;transition:opacity .38s}
.fade.on{opacity:1}
.load{position:fixed;inset:0;display:grid;place-items:center;font:italic 400 18px var(--serif);color:#3d5560;z-index:9;background:var(--sky);transition:opacity .6s}
.load.off{opacity:0;pointer-events:none}

@media (max-width:760px){
  .hd{top:10px;padding:9px 12px 8px;max-width:calc(100% - 140px)}
  .hd h1{font-size:18px}
  .hd p{font-size:11.5px}
  .proto{font-size:9.5px;margin-top:4px}
  .langs{top:10px;right:12px;padding:7px 0;min-width:46px;font-size:11.5px}
  .langs button{padding:5px 8px;font-size:11px}
  .modes{bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  .modes button{padding:9px 16px;font-size:13px}
  /* the round icon buttons sit in one row centred on the screen; each icon centred in its circle */
  .ctl{flex-direction:row;left:0;right:0;justify-content:center;align-items:center;bottom:calc(72px + env(safe-area-inset-bottom,0px));gap:10px;pointer-events:none}
  .ctl button,.ctl a{pointer-events:auto;width:44px;height:44px;padding:0;justify-content:center;gap:0;font-size:12px}
  .ctl .tx{display:none}
  #gmaps .gpin{width:20px;height:20px}
  /* the three route buttons: a small column on the right edge, mid-screen */
  .ctl .r1,.ctl .r2,.ctl .r3{position:fixed;right:12px;width:46px;height:34px}
  .ctl .r1{top:calc(50% - 46px)}.ctl .r2{top:calc(50% - 6px)}.ctl .r3{top:calc(50% + 34px)}
  .card{left:var(--gut);right:16px;width:auto;bottom:calc(122px + env(safe-area-inset-bottom,0px));padding:10px 40px 10px 14px;border-radius:14px}
  .card p{font-size:12.5px;margin-top:4px}
  .lbl span{font-size:11px;padding:2px 8px 3px}
  .lbl::after{height:10px}
  .hint{top:auto;bottom:calc(122px + env(safe-area-inset-bottom,0px));font-size:11.5px}
  .ts{height:18%}
}
</style>

for(const [hx,hz] of [[88,FCZ],[96,FCZ],[110,-45.6],[109.5,32.4],[97,-58],[60,27],[40,27],[16,8],[14,18]])glow(h2w(hx,3.4,hz),9);

  const pool=new THREE.Mesh(new THREE.CircleGeometry(4.2,24),new THREE.MeshBasicMaterial({map:glowTex,color:'#ffcf80',transparent:true,opacity:.55,blending:THREE.AdditiveBlending,depthWrite:false}));
  pool.rotation.x=-Math.PI/2;pool.position.copy(h2w(hx,.12,hz));nightV.add(pool)}             // and its pool of light on the road

for(const [x,y,h] of [[536,338,70],[232,262,50],[88,396,34],[288,302,26],[330,430,26],[196,592,36],[452,640,96],[546,424,22],[548,196,18]])glow(V3(cx(x),h*.55,cz(y)),h*1.7+36,nightC);

  new THREE.MeshBasicMaterial({color:'#ffe9b0',transparent:true,opacity:.14,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));

planeSpot.rotation.x=-Math.PI/2;nightC.add(planeBeam,planeSpot);
{const s=new THREE.Sprite(glowMC);s.position.set(4.95,-.55,0);s.scale.set(4,4,1);planeLit.add(s)}
let night=false;
function setNight(on){night=on;document.body.classList.toggle('night',on);
  scene.background.set(on?'#141b33':PAL.backdrop);hemi.intensity=on?.38:1.25;hemi.color.set(on?'#7389cc':'#cfe0ff');hemi.groundColor.set(on?'#2a2f45':'#c9b79a');
  sun.intensity=on?.55:2.4;sun.color.set(on?'#9fb4e8':'#ffe3c0');renderer.toneMappingExposure=on?1.0:1.08;
  nightV.visible=nightC.visible=on;lamps.forEach(l=>l.intensity=on?l.userData.i:0);

  winMats.forEach(m=>{m.emissiveMap=on?m.userData.nm:null;m.emissive.set(on?'#ffffff':'#000000');m.emissiveIntensity=on?.9:0;m.needsUpdate=true});
  /* the button says what it is NOW: sun + "Trời sáng" by day, moon + "Trời tối" in the evening */
  document.getElementById('nightTx').dataset.t=on?'b.night':'b.day';document.getElementById('bNight').dataset.ta=on?'a.today':'a.tonight';applyLang()}

/* =====================================================================================
   LABELS, CAMERA, MODES
   ===================================================================================== */
const labelsEl=document.getElementById('labels');
const up=(v,dy)=>v.clone().add(V3(0,dy,0));

  {k:'z.stage',p:up(STAGE,1.2),d:36},
  {k:'z.welcome',p:up(WELCOME,1.7),d:30},

];
const ZC=[
  {k:'c.lotte',p:V3(cx(536),82,cz(338)),hi:true,go:'venue'},
  {k:'c.ndb',p:V3(cx(232),62,cz(262)),d:330},
  {k:'c.dinh',p:V3(cx(88),48,cz(396)),d:380},
  {k:'c.bridge',p:V3(cx(742),20,cz(322)),d:420},
  {k:'c.melinh',p:V3(cx(MELINH[0]-10),27,cz(MELINH[1])),d:230},
  {k:'c.bt',p:V3(cx(196),50,cz(600)),d:380},
  {k:'c.opera',p:V3(cx(330),32,cz(432)),d:300},
  {k:'c.post',p:V3(cx(288),30,cz(302)),d:300},
  {k:'c.bitexco',p:V3(cx(452),96,cz(640)),d:400},
  {k:'c.metro',p:V3(cx(548),26,cz(196)),d:260},
  {k:'c.park',p:V3(cx(557),14,cz(486)),d:260},
  {k:'z.river',p:V3(cx(625),2,cz(540)),w:true,d:420},

];
function mkLabels(list,m){for(const z of list){const d=document.createElement('div');d.className='lbl'+(z.hi?' hi':'')+(z.w?' water':'')+(z.cls?' '+z.cls:'');d.innerHTML='<span></span>';
  d.onclick=()=>{hideHint();if(z.go)setMode(z.go);else flyTo(z.p.clone().setY(0),(isM()?1.35:1)*z.d)};labelsEl.appendChild(d);z.el=d;z.sp=d.firstChild;z.m=m}}
mkLabels(ZV,'venue');mkLabels(ZC,'city');
const v3=new THREE.Vector3();let roofOn=true;
function placeLabels(){const w=innerWidth,h=innerHeight,shown=[];
  for(const z of ZV.concat(ZC)){if(z.m!==mode){if(z.vis!==false){z.el.style.display='none';z.vis=false}continue}
    v3.copy(z.p).project(camera);let vis=(roofOn||!z.arch)&&v3.z<1&&Math.abs(v3.x)<1.1&&Math.abs(v3.y)<1.1;
    const x=(v3.x*.5+.5)*w,y=(-v3.y*.5+.5)*h;
    if(vis){if(!z.bw||z.bl!==lang){z.el.style.display='';z.bw=z.sp.offsetWidth||80;z.bh=z.sp.offsetHeight||22;z.bl=lang}
      const r={l:x-z.bw/2-3,r:x+z.bw/2+3,t:y-z.bh-16,b:y};
      if(shown.some(o=>r.l<o.r&&r.r>o.l&&r.t<o.b&&r.b>o.t))vis=false;else shown.push(r)}
    z.el.style.display=vis?'':'none';z.vis=vis;if(!vis)continue;
    z.el.style.transform=`translate(${x}px,${y}px) translate(-50%,-100%)`}}

let anim=null,spin=true,holdUntil=0;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;if(reduce)spin=false;
function flyCam(pos,target,dur=1500){if(reduce||dur<=0){camera.position.copy(pos);controls.target.copy(target);anim=null;return}
  anim={p0:camera.position.clone(),t0:controls.target.clone(),p1:pos,t1:target,s:performance.now(),d:dur}}
function flyTo(target,dist){const dir=camera.position.clone().sub(controls.target).setY(0);if(dir.lengthSq()<1)dir.set(0,0,1);dir.normalize().multiplyScalar(.8).setY(.7).normalize();flyCam(target.clone().add(dir.multiplyScalar(dist)),target.clone())}
const VIEWS={
  city:m=>{const D=m?1300:800;return [V3(-10+D*.8635,D*.5,5),V3(-10,0,5)]},        // from over the river, straight at the front of Lotte Hotel Saigon
  citytop:m=>[V3(0,m?2500:1400,.5),V3(0,0,0)],
  venue:m=>{const D=m?640:325;return [h2w(46+D*.574,D*.819,-4),h2w(46,0,-4)]},      // from in front of the main entrance: the whole building with the party lawn behind
  venuetop:m=>[up(h2w(50,0,4.5),m?640:400),h2w(50,0,4)],
  lawn:m=>{const D=m?150:90;return [V3(0,D*.7071,8+D*.7071),V3(0,0,8)]}             // square on to the party lawn, 45° up
};
function view(name,dur){const [p,t]=VIEWS[name](isM());flyCam(p,t,dur)}
controls.addEventListener('start',()=>{anim=null;hideHint()});
/* opening moves. An "orbit" animation turns around the target (radius, tilt and bearing all eased) instead of flying in a straight line.
   City: start high above, turn half a circle while coming down to the view in front of Lotte, rest a beat, then the slow turntable.
   Hotel: start square on to the party lawn at 45°, then pull back and swing round to the front of the main entrance, and ask how the guest is coming. */
const sphT=new THREE.Spherical(),sphOf=(pos,tg)=>new THREE.Spherical().setFromVector3(pos.clone().sub(tg));
function orbit(t0,t1,s0,s1,dur,done,delay=0){anim={orb:true,t0:t0.clone(),t1:t1.clone(),s0,s1,s:performance.now()+delay,d:dur,done};camera.position.setFromSpherical(s0).add(t0);controls.target.copy(t0)}
const introDone={city:false,venue:false};
function intro(){const m=isM(),[p1,t1]=VIEWS[mode](m),s1=sphOf(p1,t1);introDone[mode]=true;
  if(reduce){camera.position.copy(p1);controls.target.copy(t1);if(mode==='venue')askShow();return}
  if(mode==='city')orbit(t1,t1,new THREE.Spherical(Math.min(s1.radius*2.2,3900),.14,s1.theta-Math.PI),s1,11000,()=>{holdUntil=performance.now()+1600},500);
  else{const [p0,t0]=VIEWS.lawn(m),s0=sphOf(p0,t0);while(s1.theta>s0.theta)s1.theta-=2*Math.PI;while(s1.theta<=s0.theta-2*Math.PI)s1.theta+=2*Math.PI;
    orbit(t0,t1,s0,s1,9000,()=>{holdUntil=performance.now()+1200;askShow()},2200)}}

const fadeEl=document.getElementById('fade');
function applyMode(){city.visible=mode==='city';venue.visible=mode==='venue';document.body.dataset.mode=mode;
  const c=mode==='city';
  camera.near=c?8:1;camera.far=c?9000:2500;camera.updateProjectionMatrix();
  controls.minDistance=c?140:10;controls.maxDistance=c?4200:1100;controls.autoRotateSpeed=c?-.35:.14;
  if(c){sun.position.set(-420,640,420);sun.target.position.set(0,0,0);Object.assign(sun.shadow.camera,{left:-680,right:680,top:680,bottom:-680,near:50,far:2400})}
  else{const t=h2w(50,0,4),s=h2w(50-110,170,4+120);sun.position.copy(s);sun.target.position.copy(t);Object.assign(sun.shadow.camera,{left:-170,right:170,top:170,bottom:-170,near:10,far:520})}
  sun.shadow.camera.updateProjectionMatrix();sun.target.updateMatrixWorld();
  document.getElementById('sub').dataset.t='sub.'+mode;
  document.querySelectorAll('.modes button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===mode?'true':'false'));
  closeCard();askHide();applyLang();if(introDone[mode])view(mode,0);else intro();controls.update()}
function setMode(m){if(m===mode)return;fadeEl.classList.add('on');
  setTimeout(()=>{mode=m;applyMode();const u=new URL(location.href);u.searchParams.set('mode',mode);history.replaceState(null,'',u);requestAnimationFrame(()=>fadeEl.classList.remove('on'))},400)}
document.querySelectorAll('.modes button').forEach(b=>b.onclick=()=>{hideHint();setMode(b.dataset.m)});

/* route card */
const card=document.getElementById('card');let curRoute=null;
function showRoute(k){curRoute=k;const r=ROUTES[k];r.t0=performance.now();r.mesh.geometry.setDrawRange(0,0);
  card.className='card glass on '+k;renderCard()}     // the camera stays where it is
function renderCard(){if(!curRoute)return;document.getElementById('cK').textContent=tr('b.'+curRoute);document.getElementById('cP').textContent=tr(curRoute+'.p')}
function closeCard(){card.classList.remove('on');curRoute=null}
document.getElementById('cx').onclick=closeCard;
/* "how are you coming?" */
const ask=document.getElementById('ask');let asked=false;
function askShow(){if(asked||mode!=='venue')return;asked=true;ask.classList.add('on')}
function askHide(){ask.classList.remove('on')}
document.getElementById('askX').onclick=askHide;
addEventListener('keydown',e=>{if(e.key==='Escape')askHide()});
ask.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{askHide();hideHint();showRoute(b.dataset.go)});
document.querySelectorAll('.ctl [data-r]').forEach(b=>b.onclick=()=>{hideHint();showRoute(b.dataset.r)});

/* tap the Lotte building on the city map → go to the hotel */
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();let down=null;
canvas.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY}});
canvas.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down.x,e.clientY-down.y)>6)return;down=null;if(mode!=='city')return;
  ptr.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ptr,camera);
  if(ray.intersectObject(plane,true).length){location.href='../?lang='+lang+'#cats';return}
  if(ray.intersectObject(lotteG,true).length){hideHint();setMode('venue')}});
canvas.addEventListener('pointermove',e=>{if(mode!=='city'||e.buttons)return;ptr.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ptr,camera);
  canvas.style.cursor=ray.intersectObject(plane,true).length||ray.intersectObject(lotteG,true).length?'pointer':''});

document.getElementById('bAll').onclick=()=>{hideHint();closeCard();spin=!reduce;view(mode)};   // back up high: the slow turntable resumes
document.getElementById('bTop').onclick=()=>{hideHint();view(mode+'top')};
document.getElementById('bLawn').onclick=()=>{hideHint();closeCard();view('lawn')};
document.getElementById('bNight').onclick=()=>{hideHint();setNight(!night)};
if(QS.get('night')==='1')setTimeout(()=>setNight(true),0);
function applyLang(){document.documentElement.lang=lang;
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=trm(e.dataset.t));
  document.querySelectorAll('[data-ta]').forEach(e=>e.setAttribute('aria-label',tr(e.dataset.ta)));
  document.getElementById('bLang').textContent=lang.toUpperCase();
  for(const z of ZV.concat(ZC)){z.sp.textContent=tr(z.k);z.bw=0}
  renderCard()}
document.getElementById('bLang').onclick=()=>{lang={vi:'en',en:'fr',fr:'vi'}[lang];const u=new URL(location.href);u.searchParams.set('lang',lang);history.replaceState(null,'',u);applyLang()};   // one button: each tap moves on to the next language
const hint=document.getElementById('hint');let hintT=setTimeout(()=>hint.classList.add('off'),9000);
function hideHint(){hint.classList.add('off');clearTimeout(hintT);spin=false}   // any interaction also stops the slow turntable

let wasM=isM();
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?40:30;camera.updateProjectionMatrix();
  if(isM()!==wasM){wasM=isM();applyLang()}}
addEventListener('resize',resize);
resize();applyMode();

const clock=new THREE.Clock(),tmp=new THREE.Vector3(),tmp2=new THREE.Vector3();
const hop=(t)=>Math.abs(Math.sin(t));
renderer.setAnimationLoop(()=>{const now=performance.now(),et=clock.getElapsedTime();
  if(anim){const k=Math.min(1,Math.max(0,(now-anim.s)/anim.d)),e=ease(k);
    if(anim.orb){const a=anim.s0,b=anim.s1;controls.target.lerpVectors(anim.t0,anim.t1,e);sphT.set(a.radius+(b.radius-a.radius)*e,a.phi+(b.phi-a.phi)*e,a.theta+(b.theta-a.theta)*e);camera.position.setFromSpherical(sphT).add(controls.target)}
    else{camera.position.lerpVectors(anim.p0,anim.p1,e);controls.target.lerpVectors(anim.t0,anim.t1,e)}
    if(k>=1){const d=anim.done;anim=null;if(d)d()}}
  controls.autoRotate=spin&&!anim&&now>holdUntil;controls.update();towerFade();
  if(mode==='city'){planeTick(et);
    heart.position.y=62+3*Math.sin(et*2.2);heart.rotation.y=et*.9;const s=1+.14*Math.sin(et*3);lotteRing.scale.set(s,s,1);lotteRing.material.opacity=.45+.3*Math.sin(et*3);
    for(const c of cityCars){let u,sgn=c.dir;if(c.pp){u=(c.o+et*c.sp)%2;if(u>1){u=2-u;sgn=-1}}else{u=(c.o+et*c.sp)%1;if(c.dir<0)u=1-u}
      c.c.getPointAt(u,tmp);c.c.getTangentAt(u,tmp2);
      c.g.position.set(tmp.x-tmp2.z*c.off,tmp.y,tmp.z+tmp2.x*c.off);c.g.rotation.y=Math.atan2(-tmp2.z*sgn,tmp2.x*sgn)}}
  else{
    for(const k in ROUTES){const r=ROUTES[k],on=!curRoute||curRoute===k;r.mesh.visible=on;r.start.visible=on;
      const kk=curRoute===k?Math.min(1,(now-r.t0)/2400):1;r.mesh.geometry.setDrawRange(0,Math.floor(r.count*ease(kk)/3)*3);
      r.walkers.forEach((p,i)=>{const u=((et*.03)+i/2+(k==='r2'?.2:k==='r3'?.35:0))%1;p.visible=on&&u<=kk;r.curve.getPointAt(u,tmp);r.curve.getTangentAt(u,tmp2);
        p.position.set(tmp.x,tmp.y+.35*hop(et*7+i),tmp.z);p.rotation.y=Math.atan2(tmp2.x,tmp2.z)})}
    for(const w of waiters){const u=(((w.o+et*.02*w.dir)%1)+1)%1;w.c.getPointAt(u,tmp);w.c.getTangentAt(u,tmp2);w.g.position.set(tmp.x,LY+.12*hop(et*6+w.o*9),tmp.z);w.g.rotation.y=Math.atan2(tmp2.x*w.dir,tmp2.z*w.dir)}
    for(const g of guests)g.g.position.y=LY+.07*hop(et*2.2+g.ph);
    bandPegs.forEach((p,i)=>{p.rotation.z=.07*Math.sin(et*3+i)});
    for(const c of traffic)c.g.position.z=((c.z+c.dir*et*9+86)%172+172)%172-82}
  renderer.render(scene,camera);placeLabels()});
requestAnimationFrame(()=>document.getElementById('load').classList.add('off'));
