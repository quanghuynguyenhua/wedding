<style>
/* Prototype only — not deployed. UI fonts/colours from site/index.html; the 3D look follows the "Tiny Diorama" style card. */
:root{
  --bg:#fcfcfb;--ink:#161514;--mute:#77736d;--line:#e6e3de;--soft:#f2f0ec;--hy:#b3261e;
  --acc:#e9573f;--blue:#2f6f9a;--must:#d99a1c;--sky:#b4d2de;
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;
  --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --gut:max(16px,env(safe-area-inset-left,0px));
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sky);color:var(--ink);font:400 15px/1.5 var(--sans);-webkit-text-size-adjust:100%}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button,input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.glass{background:rgba(252,252,251,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);box-shadow:0 6px 24px rgba(40,60,70,.12)}
/* tilt-shift: soft bands at the top and bottom of the picture, like a miniature photographed up close */
.ts{position:fixed;left:0;right:0;height:24%;z-index:2;pointer-events:none;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.ts.t{top:0;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
.ts.b{bottom:0;-webkit-mask-image:linear-gradient(transparent,#000);mask-image:linear-gradient(transparent,#000)}

.hd{position:fixed;top:14px;left:var(--gut);padding:12px 16px 11px;border-radius:14px;max-width:calc(100% - 150px);z-index:5}
.hd h1{font:400 22px/1.15 var(--serif);margin:0;letter-spacing:.01em}
.hd p{margin:2px 0 0;font-size:12.5px;color:var(--mute)}
.proto{display:inline-block;margin-top:6px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--hy);border:1px solid rgba(179,38,30,.35);border-radius:99px;padding:1px 8px}
.langs{position:fixed;top:14px;right:16px;display:flex;border-radius:99px;padding:3px;z-index:5}
.langs button{border:0;background:none;padding:5px 10px;border-radius:99px;font-size:12px;letter-spacing:.08em;cursor:pointer;color:var(--mute)}
.langs button[aria-pressed=true]{background:var(--ink);color:#fff}

.modes{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;border-radius:99px;padding:4px;z-index:6}
.modes button{border:0;background:none;padding:9px 18px;border-radius:99px;font-size:13.5px;cursor:pointer;color:var(--mute);white-space:nowrap}
.modes button[aria-pressed=true]{background:var(--acc);color:#fff}

.ctl{position:fixed;right:16px;bottom:22px;display:flex;flex-direction:column;gap:8px;z-index:5;align-items:flex-end}
.ctl button,.ctl a{display:flex;align-items:center;gap:8px;border-radius:99px;padding:8px 14px 8px 11px;font-size:13px;cursor:pointer;white-space:nowrap}
.ctl button:hover,.ctl a:hover{border-color:#cfc8bd}
.ctl svg{width:18px;height:18px;flex:none}
.ctl .ln{width:18px;height:5px;border-radius:3px;flex:none}
.ctl .r1 .ln{background:var(--acc)}.ctl .r2 .ln{background:var(--blue)}.ctl .r3 .ln{background:var(--must)}
body[data-mode=city] .v-only,body[data-mode=venue] .c-only{display:none!important}

.card{position:fixed;left:var(--gut);bottom:22px;width:320px;border-radius:16px;padding:14px 40px 13px 16px;z-index:6;transform:translateY(12px);opacity:0;pointer-events:none;transition:.35s ease}
.card.on{transform:none;opacity:1;pointer-events:auto}
.card .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);display:flex;align-items:center;gap:8px}
.card .k i{display:inline-block;width:22px;height:5px;border-radius:3px;background:var(--acc)}
.card.r2 .k i{background:var(--blue)}.card.r3 .k i{background:var(--must)}
.card p{margin:6px 0 0;font-size:13.5px;line-height:1.5}
.card .x{position:absolute;top:8px;right:8px;border:0;background:none;width:32px;height:32px;border-radius:50%;cursor:pointer;color:var(--mute);font-size:20px;line-height:1}
.card .x:hover{background:var(--soft)}

/* labels = little card signs on pins */
#labels{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;will-change:transform}
.lbl span{background:#f6ebd8;border-radius:7px;padding:3px 10px 4px;font:600 12.5px/1.3 "Fredoka",var(--sans);color:#272b36;white-space:nowrap;box-shadow:0 2px 0 rgba(39,43,54,.25),0 4px 10px rgba(39,43,54,.18)}
.lbl::after{display:none}
.lbl.water span{background:#e6f5f9;color:#2c6a80}
.lbl.hi span{background:var(--acc);color:#fff}
.lbl.p span{background:var(--blue);color:#fff}
.lbl.m span{background:var(--must);color:#fff}
body.night{--sky:#141b33}
body.night .load,body.night .hint{color:#c9d3ea}
.bk{display:inline-block;margin:0 8px 0 -4px;padding:0 6px;border-radius:8px;font:400 20px/1 var(--sans);color:var(--mute);vertical-align:2px}
.bk:hover{background:var(--soft)}
.lbl.road span{background:#6e7080;color:#fff;letter-spacing:.06em;font-size:11px}

.hint{position:fixed;left:50%;top:84px;transform:translateX(-50%);font-size:12.5px;color:var(--mute);padding:6px 14px;border-radius:99px;z-index:4;transition:opacity .6s;white-space:nowrap}
.hint.off{opacity:0}
.fade{position:fixed;inset:0;background:var(--sky);z-index:4;opacity:0;pointer-events:none;transition:opacity .38s}
.fade.on{opacity:1}
.load{position:fixed;inset:0;display:grid;place-items:center;font:italic 400 18px var(--serif);color:#3d5560;z-index:9;background:var(--sky);transition:opacity .6s}
.load.off{opacity:0;pointer-events:none}

@media (max-width:760px){
  .hd{top:10px;padding:9px 12px 8px;max-width:calc(100% - 140px)}
  .hd h1{font-size:18px}
  .hd p{font-size:11.5px}
  .proto{font-size:9.5px;margin-top:4px}
  .langs{top:10px;right:12px}
  .langs button{padding:5px 8px;font-size:11px}
  .modes{bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  .modes button{padding:9px 16px;font-size:13px}
  .ctl{flex-direction:row;right:auto;left:var(--gut);bottom:calc(72px + env(safe-area-inset-bottom,0px));gap:5px}
  .ctl button,.ctl a{padding:8px 9px;font-size:12px}
  .ctl .tx{display:none}
  .ctl .c-only .tx{display:inline}
  .card{left:var(--gut);right:16px;width:auto;bottom:calc(122px + env(safe-area-inset-bottom,0px));padding:10px 40px 10px 14px;border-radius:14px}
  .card p{font-size:12.5px;margin-top:4px}
  .lbl span{font-size:11px;padding:2px 8px 3px}
  .lbl::after{height:10px}
  .hint{top:auto;bottom:calc(122px + env(safe-area-inset-bottom,0px));font-size:11.5px}
  .ts{height:18%}
}
</style>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ---------- i18n: [vi, en, fr] — same pattern as site/index.html ---------- */
const T={
  "title":["Đường đến tiệc cưới","Finding the Party","Venir à la réception"],
  "sub.city":["Trung tâm Sài Gòn, quanh Lotte Hotel Saigon","Downtown Saigon, around Lotte Hotel Saigon","Centre de Saïgon, autour du Lotte Hotel Saigon"],
  "sub.venue":["Lotte Hotel Saigon · sân vườn cạnh hồ bơi","Lotte Hotel Saigon · the poolside garden","Lotte Hotel Saigon · le jardin près de la piscine"],
  "proto":["Bản thử · vị trí bàn chỉ là minh hoạ","Prototype · table layout is illustrative","Prototype · plan de tables indicatif"],
  "hint":["Kéo để xoay · cuộn để phóng to · bấm vào nhãn để bay tới","Drag to rotate · scroll to zoom · tap a label to fly there","Glissez pour pivoter · molette pour zoomer · touchez une étiquette pour y aller"],
  "hintm":["Một ngón để xoay · hai ngón để phóng to","One finger to rotate · two to zoom","Un doigt pour pivoter · deux pour zoomer"],
  "mode.city":["Thành phố","City","Ville"],
  "mode.venue":["Khách sạn & sân tiệc","Hotel & Garden","Hôtel & jardin"],
  "mode.venuem":["Khách sạn","Hotel","Hôtel"],
  "b.gmaps":["Mở Google Maps","Open Google Maps","Ouvrir Google Maps"],
  "b.all":["Toàn cảnh","Overview","Vue d’ensemble"],
  "b.lawn":["Khu tiệc","Party Lawn","Jardin de réception"],
  "b.top":["Nhìn từ trên","Top View","Vue de dessus"],
  "b.night":["Trời tối","Evening","Soirée"],
  "b.day":["Trời sáng","Daytime","Journée"],
  "b.back":["Về trang cưới","Back to the wedding site","Retour au site du mariage"],
  "b.r1":["Đi từ cổng chính","From the Main Entrance","Depuis l’entrée principale"],
  "b.r2":["Đi từ bãi xe ô tô","From the Car Park","Depuis le parking voitures"],
  "b.r3":["Đi từ bãi xe máy","From the Motorbike Park","Depuis le parking motos"],
  "b.close":["Đóng","Close","Fermer"],
  "a.lang":["Ngôn ngữ","Language","Langue"],
  "a.mode":["Chọn bản đồ","Choose the map","Choisir la carte"],
  "a.canvas":["Bản đồ 3D đường đến tiệc cưới","3D map of the way to the wedding","Plan 3D pour venir au mariage"],
  "loading":["Đang dựng bản đồ…","Building the map…","Construction de la carte…"],
  "r1.p":["Từ cổng chính: đi qua sảnh đón khách, vòng qua sảnh chờ rồi ra phía hồ bơi là thấy khu tiệc.","From the main entrance: walk through the lobby, around the lounge and out towards the pool; the party is right there.","Depuis l’entrée principale : traversez le hall, contournez le salon et sortez vers la piscine ; la réception est juste là."],
  "r2.p":["Từ bãi xe ô tô: cứ đi thẳng dọc hông khách sạn là tới khu tiệc.","From the car park: just walk straight along the side of the hotel to the party.","Depuis le parking voitures : longez simplement le côté de l’hôtel jusqu’à la réception."],
  "r3.p":["Từ bãi xe máy: đi ngang qua cổng chính, vào sảnh, xuyên qua toà nhà rồi ra phía hồ bơi là tới khu tiệc.","From the motorbike park: walk past the main entrance, in through the lobby and across the building, then out towards the pool to the party.","Depuis le parking motos : passez devant l’entrée principale, traversez le hall et le bâtiment, puis sortez vers la piscine pour rejoindre la réception."],
  "z.stage":["Sân khấu","Stage","Scène"],
  "z.cocktail":["Bàn cocktail","Cocktail Tables","Mange-debout"],
  "z.gallery":["Tường ảnh","Gallery Wall","Mur de photos"],
  "z.welcome":["Bàn đón khách","Welcome Table","Table d’accueil"],
  "z.backdrop":["Backdrop chụp hình","Photo Backdrop","Décor photo"],
  "z.entrance":["Lối vào khu tiệc","Party Entrance","Entrée de la réception"],
  "z.pool":["Hồ bơi","Swimming Pool","Piscine"],
  "z.pool2":["Hồ bơi nhỏ","Small Pool","Petit bassin"],
  "z.hotel":["Lotte Hotel Saigon","Lotte Hotel Saigon","Lotte Hotel Saigon"],
  "z.gate":["Cổng chính","Main Entrance","Entrée principale"],
  "z.car":["Bãi xe ô tô","Car Parking","Parking voitures"],
  "z.moto":["Bãi xe máy","Motorbike Parking","Parking motos"],
  "z.tdt":["Tôn Đức Thắng","Tôn Đức Thắng","Tôn Đức Thắng"],
  "z.river":["Sông Sài Gòn","Saigon River","Rivière de Saïgon"],
  "c.lotte":["Lotte Hotel Saigon · tiệc cưới ở đây!","Lotte Hotel Saigon · the party is here!","Lotte Hotel Saigon · la fête est ici !"],
  "c.ndb":["Nhà thờ Đức Bà","Notre-Dame Cathedral","Cathédrale Notre-Dame"],
  "c.dinh":["Dinh Độc Lập","Independence Palace","Palais de l’Indépendance"],
  "c.bridge":["Cầu Ba Son","Ba Son Bridge","Pont Ba Son"],
  "c.melinh":["Công trường Mê Linh","Me Linh Square","Place Mê Linh"],
  "c.post":["Bưu điện","Central Post Office","Poste centrale"],
  "c.opera":["Nhà hát Thành phố","Opera House","Opéra de Saïgon"],
  "c.bt":["Chợ Bến Thành","Ben Thanh Market","Marché Bến Thành"],
  "c.bitexco":["Bitexco","Bitexco","Bitexco"],
  "c.metro":["Ga Ba Son","Ba Son Station","Station Ba Son"],
  "c.park":["Công viên Bạch Đằng","Bach Dang Park","Parc Bạch Đằng"],
  "c.tt":["Thủ Thiêm","Thu Thiem","Thủ Thiêm"]
};
const LI={vi:0,en:1,fr:2};
const QS=new URLSearchParams(location.search);
let lang=(QS.get('lang')||'vi').toLowerCase();if(!(lang in LI))lang='vi';
let mode=QS.get('mode')==='venue'?'venue':'city';
const isM=()=>innerWidth<=760;
function tr(k){const v=T[k];return v?v[LI[lang]]:k}
function trm(k){return isM()&&T[k+'m']?tr(k+'m'):tr(k)}

await Promise.race([Promise.all([document.fonts.load('500 12px "Be Vietnam Pro"'),document.fonts.load('600 20px "Fredoka"')]),new Promise(r=>setTimeout(r,2500))]).catch(()=>{});

/* ---------- "Tiny Diorama" paint box: neutrals, two greens, earth, and ONE accent for the thing the story follows ---------- */
const PAL={backdrop:'#b4d2de',grass:'#9fc47c',leaf:['#5fa574','#3f866c','#84ba6b'],trunk:'#8b5b3e',
  earth:['#5c4135','#8f6248','#c9955f','#7c7f8e'],stone:['#a9a9b0','#d9cdb8','#8d8f9c'],
  cream:'#f6ebd8',sand:'#e9dcc2',slate:'#44718a',mustard:'#f0b040',accent:'#e9573f',glass:'#2c4658',dark:'#272b36',
  road:'#6e7080',skin:'#f2c8a2',water:'#8fd0e0',bronze:'#5b4a3c'};

/* ---------- renderer / scene ---------- */
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.08;

const scene=new THREE.Scene();
scene.background=new THREE.Color(PAL.backdrop);
const camera=new THREE.PerspectiveCamera(30,1,0.5,1400);
const controls=new OrbitControls(camera,canvas);
controls.enableDamping=true;controls.dampingFactor=0.08;
controls.maxPolarAngle=Math.PI*0.46;
controls.screenSpacePanning=false;controls.autoRotateSpeed=.35;

/* one soft warm sun from the front left + a cool sky */
const hemi=new THREE.HemisphereLight('#cfe0ff','#c9b79a',1.25);scene.add(hemi);
const sun=new THREE.DirectionalLight('#ffe3c0',2.4);
sun.castShadow=true;
sun.shadow.mapSize.set(isM()?2048:4096,isM()?2048:4096);
sun.shadow.bias=-0.0006;sun.shadow.normalBias=.06;sun.shadow.radius=3;
scene.add(sun,sun.target);

/* ---------- helpers ---------- */
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
const venue=new THREE.Group(),city=new THREE.Group();scene.add(venue,city);
let PARENT=venue;
const MC={};
const M=(c,o)=>{if(o)return new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.9,metalness:0},o));return MC[c]||(MC[c]=new THREE.MeshStandardMaterial({color:c,roughness:.9,metalness:0}))};
function mesh(g,m,{x=0,y=0,z=0,ry=0,cast=true,recv=true,p=PARENT}={}){const o=new THREE.Mesh(g,typeof m==='string'?M(m):m);o.position.set(x,y,z);o.rotation.y=ry;o.castShadow=cast;o.receiveShadow=recv;p.add(o);return o}
const box=(w,h,d,m,o)=>mesh(new THREE.BoxGeometry(w,h,d),m,o);
const rbox=(w,h,d,m,o={})=>mesh(new RoundedBoxGeometry(w,h,d,3,Math.min(o.r==null?.35:o.r,w/2,h/2,d/2)),m,o);
const cyl=(rt,rb,h,seg,m,o)=>mesh(new THREE.CylinderGeometry(rt,rb,h,seg),m,o);

function R(th){const c=Math.cos(th),s=Math.sin(th);

{const nu=48,nv=12,pos=[],idx=[];

    for(const c of cityCars){let u,sgn=c.dir;if(c.pp){u=(c.o+et*c.sp)%2;if(u>1){u=2-u;sgn=-1}}else{u=(c.o+et*c.sp)%1;if(c.dir<0)u=1-u}
      c.c.getPointAt(u,tmp);c.c.getTangentAt(u,tmp2);
      c.g.position.set(tmp.x-tmp2.z*c.off,tmp.y,tmp.z+tmp2.x*c.off);c.g.rotation.y=Math.atan2(-tmp2.z*sgn,tmp2.x*sgn)}}
  else{
    for(const k in ROUTES){const r=ROUTES[k],on=!curRoute||curRoute===k;r.mesh.visible=on;r.start.visible=on;
      const kk=curRoute===k?Math.min(1,(now-r.t0)/2400):1;r.mesh.geometry.setDrawRange(0,Math.floor(r.count*ease(kk)/3)*3);
      r.walkers.forEach((p,i)=>{const u=((et*.03)+i/2+(k==='r2'?.2:k==='r3'?.35:0))%1;p.visible=on&&u<=kk;r.curve.getPointAt(u,tmp);r.curve.getTangentAt(u,tmp2);
        p.position.set(tmp.x,tmp.y+.35*hop(et*7+i),tmp.z);p.rotation.y=Math.atan2(tmp2.x,tmp2.z)})}
    for(const w of waiters){const u=(((w.o+et*.02*w.dir)%1)+1)%1;w.c.getPointAt(u,tmp);w.c.getTangentAt(u,tmp2);w.g.position.set(tmp.x,LY+.12*hop(et*6+w.o*9),tmp.z);w.g.rotation.y=Math.atan2(tmp2.x*w.dir,tmp2.z*w.dir)}
    for(const g of guests)g.g.position.y=LY+.07*hop(et*2.2+g.ph);
    bandPegs.forEach((p,i)=>{p.rotation.z=.07*Math.sin(et*3+i)});
    for(const c of traffic)c.g.position.z=((c.z+c.dir*et*9+86)%172+172)%172-82}
  renderer.render(scene,camera);placeLabels()});
requestAnimationFrame(()=>document.getElementById('load').classList.add('off'));
